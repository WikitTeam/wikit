name: Sync upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync WikitTeam/wikit \
            --source kakushi-w/wikit \
            --force

  sync-releases:
    needs: sync-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync releases with retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 最多尝试 10 次，每次间隔 30s，给上游 workflow 跑完的时间
          for attempt in $(seq 1 10); do
            echo "=== Attempt $attempt ==="

            tags=$(curl -s -H "Accept: application/vnd.github+json" \
                     https://api.github.com/repos/kakushi-w/wikit/releases \
                     | jq -r '.[].tag_name')

            if [ -z "$tags" ]; then
              echo "No releases found upstream yet, waiting..."
              sleep 30
              continue
            fi

            sync_ok=1
            for tag in $tags; do
              echo "Processing release: $tag"

              release=$(curl -s -H "Accept: application/vnd.github+json" \
                          https://api.github.com/repos/kakushi-w/wikit/releases/tags/$tag)

              asset_count=$(echo "$release" | jq '.assets | length' 2>/dev/null || echo 0)
              if [ "$asset_count" -eq 0 ]; then
                echo "  Assets not ready yet (attempt $attempt), waiting..."
                sync_ok=0
                break
              fi

              name=$(echo "$release" | jq -r '.name // .tag_name')
              body=$(echo "$release" | jq -r '.body // ""')
              draft=$(echo "$release" | jq -r '.draft')
              prerelease=$(echo "$release" | jq -r '.prerelease')

              gh release delete "$tag" --repo WikitTeam/wikit --yes 2>/dev/null || true
              git push --delete origin "refs/tags/$tag" 2>/dev/null || true

              gh release create "$tag" \
                --repo WikitTeam/wikit \
                --title "$name" \
                --notes "$body" \
                --draft="$draft" \
                --prerelease="$prerelease"

              echo "$release" | jq -c '.assets[]?[]' | while IFS= read -r asset; do
                url=$(echo "$asset" | jq -r '.url')
                fname=$(echo "$asset" | jq -r '.name')
                echo "  Downloading asset: $fname"
                curl -sL --retry 3 --retry-delay 5 \
                  -H "Accept: application/octet-stream" \
                  "$url" -o "$fname"
                gh release upload "$tag" "$fname" --repo WikitTeam/wikit
                rm -f "$fname"
              done

              echo "  Synced: $tag"
            done

            if [ "$sync_ok" -eq 1 ]; then
              echo "All releases synced successfully!"
              exit 0
            fi

            echo "Some assets not ready, waiting 30s before retry..."
            sleep 30
          done

          echo "Failed to sync after 10 attempts"
          exit 1
