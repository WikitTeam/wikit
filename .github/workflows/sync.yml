name: Sync upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync WikitTeam/wikit \
            --source kakushi-w/wikit \
            --force

  sync-releases:
    needs: sync-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync releases and all assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 拿上游所有 release 的 tag（gh api 不会返回 HTML）
          tags=$(gh api repos/kakushi-w/wikit/releases --jq '.[].tag_name')

          for tag in $tags; do
            echo "Processing release: $tag"

            # 单个 release 详情，JSON 安全
            release_json=$(gh api repos/kakushi-w/wikit/releases/tags/$tag)
            echo "$release_json" | jq -e . >/dev/null || {
              echo "  Invalid JSON, skip"; continue
            }

            name=$(echo "$release_json" | jq -r '.name // .tag_name')
            body=$(echo "$release_json" | jq -r '.body // ""')
            draft=$(echo "$release_json" | jq -r '.draft')
            prerelease=$(echo "$release_json" | jq -r '.prerelease')

            # 清掉旧 release + 旧 tag
            gh release delete "$tag" --repo WikitTeam/wikit --yes 2>/dev/null || true
            git push --delete origin "refs/tags/$tag" 2>/dev/null || true

            # 建 release 壳子
            gh release create "$tag" \
              --repo WikitTeam/wikit \
              --title "$name" \
              --notes "$body" \
              --draft="$draft" \
              --prerelease="$prerelease"

            # 同步全部 assets（含 5 个二进制 + SHA256SUMS + 2 个源码包）
            asset_count=$(echo "$release_json" | jq '.assets | length')
            echo "  Upstream assets: $asset_count"
            echo "$release_json" | jq -c '.assets[]' | while IFS= read -r asset; do
              fname=$(echo "$asset" | jq -r '.name')
              dl=$(echo "$asset" | jq -r '.browser_download_url')
              echo "  Downloading: $fname"
              curl -fsSL "$dl" -o "$fname"
              gh release upload "$tag" "$fname" --repo WikitTeam/wikit
              rm -f "$fname"
            done

            echo "Synced release: $tag"
          done
