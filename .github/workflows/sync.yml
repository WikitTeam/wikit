name: Sync upstream

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync WikitTeam/wikit \
            --source kakushi-w/wikit \
            --force

  sync-releases:
    needs: sync-code
    runs-on: ubuntu-latest
    steps:
      - name: Sync releases
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # 获取上游所有 releases
          releases=$(curl -s https://api.github.com/repos/kakushi-w/wikit/releases)

          # 遍历每个 release
          echo "$releases" | jq -c '.[]' | while read -r release; do
            tag=$(echo "$release" | jq -r '.tag_name')
            name=$(echo "$release" | jq -r '.name')
            body=$(echo "$release" | jq -r '.body')
            draft=$(echo "$release" | jq -r '.draft')
            prerelease=$(echo "$release" | jq -r '.prerelease')

            # 尝试创建（已存在会报 422，忽略即可）
            gh release create "$tag" \
              --repo WikitTeam/wikit \
              --title "$name" \
              --notes "$body" \
              --draft="$draft" \
              --prerelease="$prerelease" 2>/dev/null || echo "Release $tag already exists, skipping"
          done
