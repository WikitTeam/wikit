name: Sync upstream

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync WikitTeam/wikit \
            --source kakushi-w/wikit \
            --force

  sync-releases:
    needs: sync-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync releases and assets
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          tags=$(curl -s https://api.github.com/repos/kakushi-w/wikit/releases | jq -r '.[].tag_name')

          for tag in $tags; do
            release=$(curl -s https://api.github.com/repos/kakushi-w/wikit/releases/tags/$tag)

            name=$(echo "$release" | jq -r '.name // .tag_name')
            body=$(echo "$release" | jq -r '.body // ""')
            draft=$(echo "$release" | jq -r '.draft')
            prerelease=$(echo "$release" | jq -r '.prerelease')

            echo "Processing release: $tag"

            gh release delete "$tag" --repo WikitTeam/wikit --yes 2>/dev/null || true
            git push --delete origin "refs/tags/$tag" 2>/dev/null || true

            gh release create "$tag" \
              --repo WikitTeam/wikit \
              --title "$name" \
              --notes "$body" \
              --draft="$draft" \
              --prerelease="$prerelease"

            echo "$release" | jq -c '.assets[]?[]' | while IFS= read -r asset; do
              url=$(echo "$asset" | jq -r '.url')
              fname=$(echo "$asset" | jq -r '.name')
              echo "  Downloading asset: $fname"
              curl -sL -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" \
                -H "Accept: application/octet-stream" \
                "$url" -o "$fname"
              gh release upload "$tag" "$fname" --repo WikitTeam/wikit
              rm -f "$fname"
            done

            echo "Synced release: $tag"
          done
