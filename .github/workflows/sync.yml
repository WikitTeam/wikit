name: Sync upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync WikitTeam/wikit \
            --source kakushi-w/wikit \
            --force

  sync-releases:
    needs: sync-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync releases (update in place, no duplicates)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(gh api repos/kakushi-w/wikit/releases --jq '.[].tag_name')

          for tag in $tags; do
            echo "=== Processing release: $tag ==="

            release_json=$(gh api repos/kakushi-w/wikit/releases/tags/$tag)
            echo "$release_json" | jq -e . >/dev/null || { echo "  Invalid JSON, skip"; continue; }

            name=$(echo "$release_json" | jq -r '.name // .tag_name')
            body=$(echo "$release_json" | jq -r '.body // ""')
            draft=$(echo "$release_json" | jq -r '.draft')
            prerelease=$(echo "$release_json" | jq -r '.prerelease')

            # 检查目标 release 是否已存在
            existing=$(gh release view "$tag" --repo WikitTeam/wikit 2>/dev/null)
            if [ -z "$existing" ]; then
              echo "  Release does not exist yet, creating..."
              gh release create "$tag" \
                --repo WikitTeam/wikit \
                --title "$name" \
                --notes "$body" \
                --draft="$draft" \
                --prerelease="$prerelease"
            else
              echo "  Release already exists, updating in place (no duplicate)..."
            fi

            # 上传附件 —— 同名自动覆盖，不会新建 release
            echo "$release_json" | jq -c '.assets[]' | while IFS= read -r asset; do
              fname=$(echo "$asset" | jq -r '.name')
              dl=$(echo "$asset" | jq -r '.browser_download_url')
              echo "  Uploading: $fname"
              curl -fsSL "$dl" -o "$fname"
              gh release upload "$tag" "$fname" --repo WikitTeam/wikit
              rm -f "$fname"
            done

            echo "Done: $tag"
          done
