name: Sync from kakushi-w/wikit

on:
  schedule:
    # 每 3 天 UTC 0 点执行
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/kakushi-w/wikit.git
          git fetch upstream --tags

      - name: Detect upstream default branch
        id: default_branch
        run: |
          BRANCH=$(git remote show upstream | awk '/HEAD branch/ {print $NF}')
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Sync default branch
        run: |
          git checkout ${{ steps.default_branch.outputs.branch }}
          git pull upstream ${{ steps.default_branch.outputs.branch }}
          git push origin ${{ steps.default_branch.outputs.branch }}

      - name: Sync all branches
        run: |
          for branch in $(git branch -r | grep 'upstream/' | grep -v 'HEAD' | sed 's|upstream/||'); do
            git checkout -B $branch upstream/$branch
            git push origin $branch
          done

      - name: Sync tags
        run: |
          git push --tags

  sync-releases:
    needs: sync
    runs-on: ubuntu-latest

    steps:
      - name: Sync releases from upstream
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            const upstream = 'kakushi-w/wikit';
            const target = 'WikitTeam/wikit';

            const releases = await github.rest.repos.listReleases({
              owner: 'kakushi-w',
              repo: 'wikit',
              per_page: 100
            });

            for (const release of releases.data) {
              try {
                await github.rest.repos.createRelease({
                  owner: 'WikitTeam',
                  repo: 'wikit',
                  tag_name: release.tag_name,
                  name: release.name,
                  body: release.body,
                  draft: release.draft,
                  prerelease: release.prerelease
                });
                console.log(`Synced release: ${release.tag_name}`);
              } catch (e) {
                if (e.status === 422) {
                  console.log(`Release already exists: ${release.tag_name}`);
                } else {
                  throw e;
                }
              }
            }
